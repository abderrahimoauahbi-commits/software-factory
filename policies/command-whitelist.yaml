schema_version: '1.0'
id: command-whitelist
name: Liste blanche des commandes du Bootstrap CHECK
version: '1.0'
source: instruction « COMMANDES AUTORISÉES — BOOTSTRAP CHECK STRICT » du 15/10/2026
rule: 'Une commande absente est refusée sans être exécutée (COMMAND_NOT_ALLOWED). Aucun shell : argv exact.'
git_path_prefix: « git -C <chemin> » est admis si <chemin> appartient à ROOT_SCOPE.
allowed:
- - git
  - --version
- - code
  - --version
- - claude
  - --version
- - rustc
  - --version
- - cargo
  - --version
- - rustup
  - --version
- - node
  - --version
- - npm
  - --version
- - pnpm
  - --version
- - yarn
  - --version
- - bun
  - --version
- - psql
  - --version
- - npx
  - --version
- - rustup
  - show
- - rustup
  - toolchain
  - list
- - rustup
  - target
  - list
  - --installed
- - git
  - status
  - --short
  - --branch
- - git
  - status
- - git
  - branch
  - --show-current
- - git
  - branch
  - --list
- - git
  - remote
  - -v
- - git
  - tag
  - --list
- - git
  - worktree
  - list
- - git
  - diff
  - --stat
- - git
  - diff
  - --name-only
- - git
  - diff
  - --check
- - git
  - rev-parse
  - --show-toplevel
- - git
  - config
  - --get
  - <clé>
- - git
  - log
  - --oneline
  - -n
  - <N>
- - git
  - ls-files
- - git
  - ls-files
  - --others
  - --ignored
  - --exclude-standard
  - --directory
- - code
  - --list-extensions
directory_options: {git: "-C"}          # « git -C <chemin> » : <chemin> doit appartenir à ROOT_SCOPE
placeholders:
  <clé>: ^[a-z][a-z0-9.-]*$
  <N>: ^[0-9]{1,3}$
notes:
- '« code --list-extensions » : commande documentée purement informative (règle 9 de la liste blanche).'
pending_requests:
- command:
  - claude
  - doctor
  purpose: validité des fichiers de réglages
  status: WAITING_HUMAN
- command:
  - rustfmt
  - --version
  purpose: version de FORMAT
  status: WAITING_HUMAN
- command:
  - cargo
  - clippy
  - --version
  purpose: version de LINT
  status: WAITING_HUMAN
forbidden_examples:
- git add/commit/push/pull/fetch/merge/rebase/reset/checkout/switch/restore/clean/stash
- cargo build/check/test/run/install/update
- npm install/ci/run
- psql <connexion>
- curl/wget/Invoke-WebRequest
- claude update
- claude mcp list (démarre les serveurs MCP)
