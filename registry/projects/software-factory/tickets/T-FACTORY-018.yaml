specification:
  business_rules:
  - une revue déclarée n'est pas une preuve
  - la revue est liée à l'empreinte du diff complet ; tout changement de code l'invalide
  functional_requirements:
  - demande de revue préparée par la plateforme
  - affichage du diff vérifié par la commande humaine
  - preuve REVIEW tirée de l'enregistrement humain
  non_functional_requirements:
  - aucune création d'enregistrement humain par l'agent
  acceptance_criteria:
  - revue déclarée par l'agent refusée
  - revue APPROVED → QA ; CHANGES_REQUESTED → IN_PROGRESS
  - diff modifié après la revue → revue invalide
  - revue d'un autre ticket ou approbation ordinaire refusée
