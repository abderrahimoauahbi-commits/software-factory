id: T-FACTORY-019
project_id: software-factory
workflow_id: feature
title: 'Différences d''extraction et sorties des gates : relevées, montrées, figées'
objective: Ne plus confondre avec un changement de l'agent un fichier différent dès l'extraction (fins de ligne)
  ni un fichier produit par les gates, sans affaiblir le contrôle de périmètre
requester: Factory Owner
state: IMPLEMENTED
criticality: C3
criticality_justification: 'Contrôle de périmètre (SCOPE_VIOLATION) et preuves de revue : contrôle de sécurité (Playbook
  §9.1, §10.4).'
scope:
  included:
  - core/noyau/execution.py
  - core/noyau/revue.py
  - policies/execution.yaml
  - scripts/factory_approve.py
  - core/tests/test_execution.py
  - adr/accepted/ADR-0013-differences-d-extraction.md
  excluded:
