  - configuration de l'agent
  roots:
  - FACTORY_ROOT
  files: []
  modules: []
  services: []
  data: []
specification:
  business_rules:
  - une différence d'extraction n'est écartée que si son contenu est identique à celui relevé avant le travail de
    l'agent
  - le diff relu ne contient que les fichiers de l'agent ; le reste est listé avec son empreinte
  functional_requirements:
  - relevé à la création de l'espace
  - relevé après les gates
  - revue refusée si l'espace a bougé depuis la clôture
  non_functional_requirements:
  - aucun affaiblissement du contrôle de périmètre
  acceptance_criteria:
  - différence d'extraction inchangée écartée et montrée
  - différence retouchée par l'agent → SCOPE_VIOLATION
  - sorties des gates hors du diff, listées
  - fichier ajouté ou sortie modifiée après clôture → revue impossible
