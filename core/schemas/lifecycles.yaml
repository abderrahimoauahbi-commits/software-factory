# Environnement jetable (Master Evolution Prompt v4 §11–§12) : créé, réinitialisé et détruit par la Factory.
environment:
  states:
  - REQUESTED
  - PROVISIONING
  - READY
  - RESETTING
  - DESTROYING
  - DESTROYED
  - FAILED
  initial: REQUESTED
  transitions:
  - from: REQUESTED
    to: PROVISIONING
  - from: PROVISIONING
    to: READY
  - from: READY
    to: RESETTING
  - from: RESETTING
    to: READY
  - from: READY
    to: DESTROYING
  - from: FAILED
    to: DESTROYING
  - from: DESTROYING
    to: DESTROYED
  terminal:
  - DESTROYED
  any_to:
  - FAILED
# Bail de capacités (Master Evolution Prompt v4 §6) : n'existe qu'actif ou terminé ; jamais réactivé.
capability_lease:
  states:
  - REQUESTED
  - ACTIVE
  - DENIED
  - RELEASED
  - EXPIRED
  - REVOKED
  - INVALIDATED       # condition obligatoire perdue (politique changée, bail altéré) — ADR-0017 §3.2, étape G1
  initial: REQUESTED
  transitions:
  - from: REQUESTED
    to: ACTIVE
  - from: REQUESTED
    to: DENIED
  - from: ACTIVE
    to: RELEASED
  - from: ACTIVE
    to: EXPIRED
  terminal:
  - DENIED
  - RELEASED
  - EXPIRED
  - REVOKED
  - INVALIDATED
  any_to:
  - REVOKED
  - INVALIDATED
